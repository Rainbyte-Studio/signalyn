name: Entity review archive regression
on: pull_request

permissions:
  contents: read

jobs:
  entity-review-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install vitest run tests/entityReviewArchive.test.ts
      - run: npm run build
