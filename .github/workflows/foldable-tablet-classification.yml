name: Strategic relevance regression
on: pull_request

permissions:
  contents: read

jobs:
  strategic-relevance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install vitest run tests/foldableTabletClassification.test.ts
      - run: npx --no-install tsx tests/relevanceGate.test.ts
