name: Daily Brief historical activity regression
on: pull_request

permissions:
  contents: read

jobs:
  daily-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install vitest run tests/dailyBriefHistoricalActivity.test.ts tests/dailyBriefCoverageCounts.test.ts
