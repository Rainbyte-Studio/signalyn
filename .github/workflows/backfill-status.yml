name: Backfill status regression
on: pull_request

permissions:
  contents: read

jobs:
  backfill-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install vitest run tests/backfillStatusReadOnly.test.ts tests/historicalBacklogCleanupAndQuota.test.ts tests/historicalBackfillRecoveryAndLease.test.ts tests/entityReviewBatchAndDedup.test.ts
      - run: npx --no-install tsx tests/phase6dHistoricalBackfill.test.ts
